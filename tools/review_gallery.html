<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PhyRC 시연 영상</title>
    <style>
      [hidden] { display: none !important; }
      :root {
        color-scheme: dark;
        --bg: #10171a;
        --panel: #182125;
        --line: #364349;
        --ink: #eef3f2;
        --muted: #b5c4c6;
        --link: #a9e4cf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.65 Inter,
          "Apple SD Gothic Neo",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 1440px;
        margin: auto;
        padding: 24px clamp(16px, 3vw, 48px) 64px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: clamp(1.65rem, 4vw, 2.2rem);
      }
      h2 {
        font-size: 1.2rem;
      }
      h3,
      dt {
        font-size: 0.96rem;
      }
      a {
        color: var(--link);
        text-underline-offset: 0.2em;
      }
      a:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid #f2c67b;
        outline-offset: 3px;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }
      header a {
        font-size: 0.92rem;
      }
      summary {
        cursor: pointer;
        color: var(--link);
        font-weight: 600;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem 0.9rem;
      }
      #workspace {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(270px, 0.8fr);
        gap: clamp(18px, 3vw, 38px);
        margin-top: 20px;
      }
      #segment-player,
      #cumulative {
        grid-column: 1 / -1;
        min-width: 0;
      }
      #player {
        display: block;
        width: 100%;
        max-height: 76vh;
        background: #080d10;
        border-radius: 6px;
      }
      #cumulative {
        padding: 0.7rem 0.9rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
      }
      #cumulative-select {
        margin: 0.5rem 0;
      }
      #cumulative-image {
        display: block;
        max-width: 100%;
        max-height: 76vh;
        margin: 0.5rem auto 0;
        object-fit: contain;
      }
      #clip-title {
        margin: 0 0 0.5rem;
      }
      aside {
        min-width: 0;
      }
      select {
        width: 100%;
        font: inherit;
        color: var(--ink);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.45rem;
      }
      label,
      small {
        color: var(--muted);
      }
      #list {
        max-height: 50vh;
        overflow: auto;
        list-style: none;
        margin: 0.65rem 0 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }
      #permalink {
        display: block;
        width: 100%;
        color: var(--link);
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 0.45rem;
        font: inherit;
        font-size: 0.85rem;
      }
      #list li {
        margin: 0;
      }
      #list a {
        display: block;
        padding: 0.44rem 0.65rem;
        border-bottom: 1px solid var(--line);
        text-decoration: none;
      }
      #list [aria-current] {
        background: #233d36;
        color: #fff;
        border-left: 3px solid var(--link);
      }
      #details h3 {
        margin-top: 1rem;
      }
      #details p {
        white-space: pre-line;
      }
      #feedback {
        margin: 1rem 0 0;
        color: var(--muted);
      }
      #refresh-note {
        color: var(--muted);
        font-size: 0.9rem;
      }
      @media (max-width: 700px) {
        #workspace {
          grid-template-columns: 1fr;
        }
        #list {
          max-height: 42vh;
        }
        #player {
          max-height: 63vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>PhyRC 시연 영상</h1>
        <nav aria-label="영상 탐색">
          <a id="jump" hidden>이 시연의 최신 구간</a>
          <a id="home">최신 시연의 최신 구간</a>
        </nav>
      </header>
      <p id="reload-note">
        <small
          >새로고침하면 최신 시연의 최신 구간이 열립니다.</small
        >
      </p>
      <p id="notice" role="status">구간 목록을 불러오는 중입니다.</p>
      <div id="workspace" hidden>
        <details id="cumulative" open hidden>
          <summary>누적 GIF · 0초부터 재생</summary>
          <p id="branch-origin" hidden></p>
          <label for="cumulative-select">재생할 끝 구간</label>
          <select id="cumulative-select"></select>
          <img id="cumulative-image" hidden alt="0초부터 선택 구간까지 이어지는 5카메라 영상" />
        </details>
        <section id="segment-player">
          <h2 id="clip-title"></h2>
          <video id="player" controls autoplay muted playsinline preload="none"></video>
        </section>
        <section>
          <nav>
            <label for="permalink">이 구간 주소</label
            ><input id="permalink" readonly aria-label="이 구간 주소" />
          </nav>
          <div id="details"></div>
          <p id="feedback">
            실행 중 개입이 필요하면 채팅에 회차와 구간을 적어 주세요.
          </p>
        </section>
        <aside>
          <label for="runs">회차</label
          ><select id="runs"></select>
          <p id="refresh-note"></p>
          <ul id="list" aria-label="구간 영상"></ul>
        </aside>
      </div>
    </main>
    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const runNumbers = {
        "20261125T004206Z-demo15-sol-ultra-left-support": "16",
      };
      const parts = location.pathname.split("/").map(decodeURIComponent);
      const marker = parts.lastIndexOf("PhyRC-gallery");
      const rootParts = parts.slice(0, marker < 0 ? -1 : marker);
      const filesRoot = rootParts.map(encodeURIComponent).join("/") + "/";
      const files = rootParts.lastIndexOf("files");
      if (files >= 0) rootParts[files] = "view";
      const viewRoot = rootParts.map(encodeURIComponent).join("/") + "/";
      let currentRun = marker < 0 ? null : parts[marker + 1];
      const requestedPage = parts[marker + 2];
      let currentSegment = marker < 0 || requestedPage === "index.html"
        ? null : requestedPage?.replace(/\.html$/, "");
      if (marker >= 0) $("reload-note").hidden = true;
      let catalog, selectedKey, gifRun;
      function el(tag, text) {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        return node;
      }
      function clipUrl(run, id) {
        return new URL(
          viewRoot +
            "PhyRC-gallery/" +
            encodeURIComponent(run) +
            "/" +
            encodeURIComponent(id) +
            ".html",
          location.href,
        ).href;
      }
      function clipLink(run, id, label) {
        const a = el("a", label);
        a.href = clipUrl(run, id);
        a.dataset.run = run;
        a.dataset.segment = id;
        return a;
      }
      function mediaUrl(run, id, extension) {
        return filesRoot + "PhyRC-gallery/" + encodeURIComponent(run) + "/" +
          encodeURIComponent(id) + "." + extension;
      }
      function playCumulative() {
        const image = $("cumulative-image");
        const chosen = $("cumulative-select").value;
        if (!$("cumulative").open || !gifRun || !chosen) {
          image.hidden = true;
          image.removeAttribute("src");
          return;
        }
        const src = mediaUrl(gifRun, chosen, "gif");
        if (image.getAttribute("src") !== src) image.src = src;
        image.hidden = false;
      }
      function renderCumulative(run, clip) {
        const clips = run.clips.filter(item => item.gif);
        const fold = $("cumulative"), select = $("cumulative-select");
        gifRun = clips.length ? run.id : null;
        fold.hidden = !gifRun;
        select.replaceChildren();
        for (const item of clips) {
          const option = el("option", `0–${(item.end_step / 20).toFixed(2)}초 · ${item.id}`);
          option.value = item.id;
          select.append(option);
        }
        if (clip.gif) select.value = clip.id;
        playCumulative();
      }
      function render() {
        if (!catalog) return;
        const run = currentRun
          ? catalog.runs.find((g) => g.id === currentRun)
          : catalog.runs[0];
        const clip =
          run &&
          (currentSegment
            ? run.clips.find((c) => c.id === currentSegment)
            : run.clips[0]);
        $("home").href = viewRoot + "PhyRC-review.html";
        $("home").hidden = !currentRun;
        const newest = run?.clips[0];
        $("jump").hidden = !newest;
        if (newest) $("jump").href = clipUrl(run.id, "index");
        if (!clip) {
          $("notice").textContent = currentRun
            ? "요청한 구간을 찾을 수 없습니다."
            : "첫 구간을 기다리는 중입니다.";
          $("workspace").hidden = true;
          return;
        }
        $("notice").textContent = "";
        $("workspace").hidden = false;
        const runs = $("runs");
        runs.replaceChildren();
        for (const g of catalog.runs) {
          const opt = el("option", g.title || g.id);
          opt.value = g.id;
          runs.append(opt);
        }
        runs.value = run.id;
        const origin = $("branch-origin");
        origin.replaceChildren();
        origin.hidden = !clip.replay_steps;
        if (clip.replay_steps) {
          const parentRun = catalog.runs.find(item => item.id === clip.parent_run);
          const parent = parentRun?.number ? `시연 ${parentRun.number}` : "이전 시연";
          origin.append(`${parent}의 행동을 ${clip.replay_steps}전이까지 재실행 · 이후는 새 행동`);
          const parentClip = parentRun?.clips.find(item => item.end_step === clip.replay_steps);
          if (parentClip) origin.append(" · ", clipLink(parentRun.id, parentClip.id, `${parent} ${parentClip.id}`));
        }
        const stateLabels = {
          running: "자동 진행 중",
          pause_requested: "개입 요청 처리 중",
          held: "개입 대기",
          closed: "종료",
        };
        $("refresh-note").textContent = [
          run.clips.length + "개 구간",
          stateLabels[run.control] || "",
        ]
          .filter(Boolean)
          .join(" · ");
        const list = $("list");
        const scroll = list.scrollTop;
        list.replaceChildren();
        for (const c of run.clips) {
          const li = el("li");
          const a = clipLink(
            run.id,
            c.id,
            c.id + " · " + c.start_step + "–" + c.end_step + "전이",
          );
          if (c.id === clip.id) a.setAttribute("aria-current", "page");
          li.append(a);
          list.append(li);
        }
        list.scrollTop = clip === newest ? 0 : scroll;
        $("clip-title").textContent =
          (run.title ? run.title + " / " : "") + clip.id + " · " + clip.start_step + "–" + clip.end_step + "전이";
        $("permalink").value = clipUrl(run.id, clip.id);
        renderCumulative(run, clip);
        const detail = $("details");
        detail.replaceChildren();
        for (const [label, t] of [
          ["장면 관찰", clip.analysis],
          ["구간 종료 시 제안", clip.next_prompt],
        ])
          if (t) detail.append(el("h3", label), el("p", t));
        const key = run.id + "/" + clip.id;
        if (key !== selectedKey) {
          const player = $("player");
          player.pause();
          player.src = mediaUrl(run.id, clip.id, "mp4");
          player.play().catch(() => {});
          selectedKey = key;
        }
      }
      document.addEventListener("click", (event) => {
        const a = event.target.closest("a");
        if (
          !a ||
          event.button !== 0 ||
          event.ctrlKey ||
          event.metaKey ||
          event.shiftKey ||
          event.altKey
        )
          return;
        if (a.dataset.run || a.id === "home") {
          event.preventDefault();
          currentRun = a.dataset.run || null;
          currentSegment = a.dataset.segment || null;
          render();
        }
      });
      $("permalink").addEventListener("focus", (e) => e.target.select());
      $("cumulative").addEventListener("toggle", playCumulative);
      $("cumulative-select").addEventListener("change", playCumulative);
      $("runs").addEventListener("change", () => {
        currentRun = $("runs").value;
        currentSegment = null;
        render();
      });
      document.addEventListener("DOMContentLoaded", () => {
        const data = document.querySelector("script[data-catalog]");
        if (!data) return;
        const {clips, controls} = JSON.parse(data.textContent);
        const groups = new Map();
        for (const clip of clips) {
          if (!groups.has(clip.run)) groups.set(clip.run, []);
          groups.get(clip.run).push(clip);
        }
        catalog = {
          runs: Array.from(groups, ([id, clips]) => {
            const sol = id.match(/-demo(\d+)-sol-(max|ultra)(?:-|$)/);
            const number = runNumbers[id] ?? sol?.[1];
            return {
              id,
              number,
              title: sol ? `시연 ${number} · GPT‑6.2 Sol ${sol[2] === "ultra" ? "Ultra" : "Max"}` : id,
              clips: clips.sort((a, b) => b.end_step - a.end_step || b.id.localeCompare(a.id)),
              control: controls[id],
            };
          }).reverse(),
        };
        render();
      });
    </script>
