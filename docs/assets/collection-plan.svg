<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">E28 onward collection plan</title><desc id="desc">A planned strategy, not a recorded rollout: the two robots stand beside the garment, spread the lower opening, place it over one manikin wrist, then proceed to the other wrist.</desc>
